<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro Url</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Micro Url</h1>
        <form id="shorten-form">
            <div>
                <label for="url">Long URL </label>
                <input type="url" name="url" placeholder="Paste Your long link here" id="url" required>
            </div>
            <div>
                <label for="shortCode">ShortCode </label>
                <input type="text" name="shortCode" placeholder="Enter Shorten Code" id="shortCode" required>
            </div>
            <button type="submit">Shorten Link</button>
        </form>
        <h2>Shortened URLs</h2>
        <ul id="shortened-urls"></ul>
    </div>
    <script>
        const fetchShortenedurl = async () => {
            try {
                const response = await fetch('/links');
                const links = await response.json();
                console.log(links)
                const list = document.getElementById('shortened-urls');
                list.innerHTML = "";
                for (const [shortCode, url] of Object.entries(links)) {
                    const li = document.createElement('li');
                    const truncatedUrl = url.length >= 30 ? `${url.slice(0,30)}...` : url;
                    li.innerHTML = `<a href="/${shortCode}" target="_blank">${window.location.origin}/${shortCode}</a> - ${truncatedUrl}`
                      list.appendChild(li)
                }

            } catch (error) {
                console.error(error);
            }
        }
        document.getElementById('shorten-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const formData = new FormData(event.target);
            const url = formData.get('url');
            const shortCode = formData.get('shortCode');
            console.log(url, shortCode);
            try {
                const response = await fetch('/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, shortCode })
                })
                if (response.ok) {
                    fetchShortenedurl();
                    alert('form successfully submitted');
                }
                else {
                    const errMessage = await response.text();
                    alert(errMessage);
                }
            } catch (error) {
                console.log(error);
            }
        })
        fetchShortenedurl();
    </script>
</body>

</html>
